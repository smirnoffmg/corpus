# Установка: pre-commit install
# Прогон по всему репозиторию: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]   # книги живут в ~/Desktop/books, в репозитории им не место
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Go-инструменты берутся установленные в системе, а не своей копией из хука:
  # golangci-lint должен совпадать с тем, которым проверяют вручную, а его
  # staticcheck ещё и чувствителен к версии Go.
  - repo: local
    hooks:
      # fmt правит (gofmt + goimports с локальным префиксом), run — проверяет,
      # в том числе форматирование. Отдельный хук gofmt был бы и лишним, и слабее:
      # он не знает про группировку импортов.
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: golangci-lint fmt
        language: system
        always_run: true
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint run
        entry: golangci-lint run
        language: system
        always_run: true       # миграция, compose или набор запросов тоже ломают сборку
        pass_filenames: false

      - id: go-test
        name: go test -race + покрытие >= 80% по пакету
        entry: scripts/coverage.sh
        language: system
        always_run: true       # миграция, compose или набор запросов тоже ломают сборку
        pass_filenames: false

      - id: corpus-eval
        name: оценка поиска (справочно)
        entry: scripts/eval.sh
        language: system
        always_run: true       # миграция, compose или набор запросов тоже ломают сборку
        pass_filenames: false
        verbose: true          # печатать вывод, даже когда хук прошёл
