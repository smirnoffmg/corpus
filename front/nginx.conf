server {
    listen 80;
    root /usr/share/nginx/html;

    # The URI in proxy_pass replaces the matched /api/ prefix: /api/search goes
    # to mcpd as /search.
    location /api/ {
        proxy_pass http://mcpd:8080/;
        # Uploads are streamed straight through rather than buffered here first:
        # mcpd writes them into the library and enforces its own size limit.
        client_max_body_size 300m;
        proxy_request_buffering off;
        # Unpacking a large manual happens before mcpd answers.
        proxy_read_timeout 600s;
    }

    # The sources themselves, for "open the original": a manual's own pages
    # with their styles and images, and a book's PDF for the browser's viewer.
    location /docs/ {
        alias /data/docs/;
    }

    location /books/ {
        alias /data/books/;
    }

    # Dot directories include a manual still being unpacked.
    location ~ /\. {
        deny all;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is a route of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
