# A request addressed to any other name is refused before it reaches anything.
# The corpus has no authentication; a page on another site could otherwise
# point its own domain at 127.0.0.1 and read the library through the browser
# (DNS rebinding). The Host header is what gives such a request away.
server {
    listen 80 default_server;
    listen 8082 default_server;
    return 403;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again as addresses expire: nginx resolves a literal
    # proxy_pass host once at start, and a rebuilt mcpd comes back on a new
    # address — every request then failed with 502 until nginx restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $mcpd http://mcpd:8080;
        # With a variable in proxy_pass nginx no longer swaps the prefix itself.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $mcpd;
        # mcpd checks Host and compares Origin with it; both have to be the
        # browser's, not the upstream's name.
        proxy_set_header Host $http_host;
        # Uploads are streamed straight through rather than buffered here first:
        # mcpd writes them into the library and enforces its own size limit.
        client_max_body_size 300m;
        proxy_request_buffering off;
        # Unpacking a large manual happens before mcpd answers.
        proxy_read_timeout 600s;
    }

    # Sources live on the sources port (below). Refused here outright rather
    # than answered with the app, so an old link fails plainly.
    location ~ ^/(docs|books)/ {
        return 404;
    }

    # Dot directories include a manual still being unpacked.
    location ~ /\. {
        deny all;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is a route of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}

# The sources themselves, for "open the original": a manual's own pages with
# their styles and images, and a book's PDF for the browser's viewer.
#
# They get an origin of their own, a separate port, and never the UI's. A
# manual is HTML with scripts — anyone with the UI open can upload one — and a
# script running on the UI's origin passes both the Host check and the
# cross-origin check, so it could read the whole library through /api and
# write to it. From this port /api is another origin: the browser will not let
# a script read the answer, and mcpd refuses the write (Sec-Fetch-Site is
# same-site, not same-origin). A CSP sandbox would isolate the pages too, but
# it takes their storage away, and themes that read localStorage break.
server {
    listen 8082;
    server_name localhost 127.0.0.1;

    add_header X-Content-Type-Options nosniff always;

    location /docs/ {
        alias /data/docs/;
    }

    # Only PDFs: an HTML file dropped among the books would be a page too.
    location /books/ {
        alias /data/books/;
        if ($uri !~* "\.pdf$") {
            return 404;
        }
    }

    location ~ /\. {
        deny all;
    }

    location / {
        return 404;
    }
}
