# Pinned, so that the database volume is corpus_pgdata whatever the clone's
# directory is called: Compose otherwise names the project, and its volumes,
# after the directory, and a clone under another name starts on an empty
# database — without the bibliographic descriptions, which files cannot rebuild.
name: corpus

# Container logs are kept by Docker until removed; a search event per query
# and an indexer that runs for months would otherwise grow them without end.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg18
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: corpus
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpus}
    volumes:
      - pgdata:/var/lib/postgresql
    # Not published to the host: only the stack's own services reach it. On the
    # host it was open to every local account with the default password.
    # `docker compose exec db psql -U corpus -d corpus` still gets a shell; a
    # compose.override.yaml can publish a port for a session that needs one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus -d corpus"]
      interval: 5s
      timeout: 3s
      retries: 10

  indexer:
    logging: *logging
    build: ./back
    image: corpus:latest
    command: ["indexer", "--interval", "15m"]
    environment:
      DATABASE_URL: postgres://corpus:${POSTGRES_PASSWORD:-corpus}@db:5432/corpus
    volumes:
      # The library is one directory holding books/ and manuals/; the vault
      # stays where Obsidian keeps it.
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/books:/data/books:ro
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/manuals:/data/docs:ro
      - ${VAULT_DIR:?set VAULT_DIR in .env}:/data/vault:ro
      # The bibliography's system of record: imported each pass, written after
      # drafting. Read-write, unlike the library itself.
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/bibliography:/data/bibliography
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Embedding is half of this service's job, and ollama runs on the host where
    # compose cannot restart it. The check cannot repair anything — it makes the
    # loss visible in `docker compose ps` instead of leaving the stack green
    # while search quietly runs on full-text alone.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://host.docker.internal:11434/api/tags >/dev/null 2>&1"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  mcpd:
    logging: *logging
    build: ./back
    image: corpus:latest
    command: ["mcpd"]
    environment:
      DATABASE_URL: postgres://corpus:${POSTGRES_PASSWORD:-corpus}@db:5432/corpus
      CORPUS_VAULT_DIR: ${VAULT_DIR:?set VAULT_DIR in .env}
    # Read-write, unlike the indexer's: uploads are saved into the library
    # itself (uploads/ under the books, one directory per manual), so that the
    # indexer finds them where it already looks.
    volumes:
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/books:/data/books
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/manuals:/data/docs
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/bibliography:/data/bibliography
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      # The indexer applies migrations on start; mcpd refuses a schema behind
      # it and is restarted until the migrations are in.
      indexer:
        condition: service_started
    restart: unless-stopped

  front:
    logging: *logging
    build: ./front
    image: corpus-front:latest
    ports:
      - "127.0.0.1:8081:80"
      # Sources for "open the original", on an origin of their own.
      - "127.0.0.1:8082:8082"
    volumes:
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/books:/data/books:ro
      - ${LIBRARY_DIR:-${HOME}/.corpus/data}/manuals:/data/docs:ro
    depends_on:
      mcpd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
