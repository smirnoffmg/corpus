services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: corpus
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpus}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus -d corpus"]
      interval: 5s
      timeout: 3s
      retries: 10

  indexer:
    build: .
    image: corpus:latest
    command: ["indexer", "--interval", "15m", "--split-above", "1600", "--split-target", "1000"]
    environment:
      DATABASE_URL: postgres://corpus:${POSTGRES_PASSWORD:-corpus}@db:5432/corpus
    volumes:
      - ${BOOKS_DIR:?set BOOKS_DIR in .env}:/data/books:ro
      - ${VAULT_DIR:?set VAULT_DIR in .env}:/data/vault:ro
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Embedding is half of this service's job, and ollama runs on the host where
    # compose cannot restart it. The check cannot repair anything — it makes the
    # loss visible in `docker compose ps` instead of leaving the stack green
    # while search quietly runs on full-text alone.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://host.docker.internal:11434/api/tags >/dev/null 2>&1"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  mcpd:
    build: .
    image: corpus:latest
    command: ["mcpd"]
    environment:
      DATABASE_URL: postgres://corpus:${POSTGRES_PASSWORD:-corpus}@db:5432/corpus
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
